services:
  rag-service:
    build: .
    container_name: book_halal_rag
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ../backend/static:/app/static:ro
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
  qdrant:
    image: qdrant/qdrant:latest
    container_name: book_halal_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
